[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facet2-twobunch-cnf"
version = "0.1.0"
description = "Conditional normalizing-flow surrogate of the FACET-II two-bunch beam (drive + witness 6D phase space and feasibility) conditioned on machine knobs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch>=2.0",
    "lightning>=2.0",
    "h5py",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/ryanwu4/facet2-twobunch-cnf"

[project.optional-dependencies]
# eval.py / plot_training.py
eval = ["matplotlib", "scikit-learn", "pandas"]
# ParticleGroup in/out (beam_io)
beam = ["openpmd-beamphysics"]
test = ["pytest", "scikit-learn"]
dev = ["pytest", "scikit-learn", "ruff", "pre-commit"]

[project.scripts]
twobunch-cnf-train = "twobunch_cnf.train:main"
twobunch-cnf-eval = "twobunch_cnf.eval:main"
twobunch-cnf-plot-training = "twobunch_cnf.plot_training:main"
twobunch-cnf-migrate = "twobunch_cnf.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# model bundles (model.ckpt + norm.json + run.json + bundle.yaml)
twobunch_cnf = ["resources/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes + pycodestyle errors; assigned lambdas are this code's idiom for small local helpers
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

# ---- pixi -------------------------------------------------------------------------------------
# `pixi install` / `pixi run -e test test`. conda-forge only, python 3.12 like the SLAC nightly
# environment; the CUDA platform entry makes the solver pick CUDA pytorch builds.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.0" }]

[tool.pixi.dependencies]
python = "3.12.*"
pytorch = "*"
lightning = "*"
numpy = "*"
h5py = "*"
pyyaml = "*"

[tool.pixi.pypi-dependencies]
facet2-twobunch-cnf = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
scikit-learn = "*"
matplotlib = "*"
pandas = "*"
openpmd-beamphysics = "*"
ruff = "*"

[tool.pixi.feature.test.tasks]
test = "pytest"
lint = "ruff check src tests"
fmt = "ruff format src tests"

# virtual-accelerator's tests against this package, run from a VA checkout (not installed, so a missing
# checkout cannot break `pixi install`): `pixi run -e va test-va [VA_DIR]`
[tool.pixi.feature.va.dependencies]
lume-base = "*"
openpmd-beamphysics = "*"
pandas = "*"
scipy = "*"
pytest = "*"

[tool.pixi.feature.va.tasks]
test-va = { cmd = "cd {{ va_dir }} && PYTHONPATH=. pytest", args = [{ arg = "va_dir", default = "../virtual-accelerator" }] }

[tool.pixi.environments]
test = ["test"]
va = ["va"]
